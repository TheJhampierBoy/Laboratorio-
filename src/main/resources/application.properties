# Datasource - valores provistos por variables de entorno en produccion/Docker
# En desarrollo local, sobreescribir con un application-local.properties o pasar como -D flags
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/laboratorio_backend}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
