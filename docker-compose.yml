services:

  mysql:
    image: mysql:8.0
    container_name: laboratorio-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: laboratorio_backend
    networks:
      - laboratorio-net
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: laboratorio-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/laboratorio_backend
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laboratorio-net

  nginx:
    image: nginx:alpine
    container_name: laboratorio-nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laboratorio-net

networks:
  laboratorio-net:
    driver: bridge

volumes:
  mysql_data:
